<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            overflow-y: auto;
            padding: 2rem 1rem;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            width: 100%; max-width: 560px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin: auto;
        }
        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }
        .seats-pill {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .seats-ok    { background: rgba(16,185,129,0.15); color: var(--success-color); }
        .seats-low   { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .seats-full  { background: rgba(239,68,68,0.15);  color: var(--danger-color); }
        .price-row { display: grid; grid-template-columns: 1fr 120px 40px; gap: 0.5rem; margin-bottom: 0.5rem; }
        .price-row input { margin: 0; }
        .icon-btn {
            background: rgba(239,68,68,0.15); color: var(--danger-color);
            border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem;
        }
        .link-btn { background: none; border: none; color: var(--primary-color); cursor: pointer; font-size: 0.85rem; padding: 0; }
        .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); }
        #imagePreview { max-height: 140px; border-radius: 8px; margin-top: 0.5rem; display: none; border: 1px solid var(--border-color); }
        .upload-status { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem; }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">EventAdmin</div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Dashboard</a></li>
                <li class="nav-item"><a href="events.html" class="nav-link active">Events</a></li>
                <li class="nav-item"><a href="users.html" class="nav-link">Users</a></li>
            </ul>
            <button onclick="api.logout()" class="btn btn-danger" style="width: 100%; margin-top: auto;">Logout</button>
        </aside>

        <main class="main-content animate-fade-in">
            <header class="flex justify-between items-center mb-4">
                <h1>Manage Events</h1>
                <button class="btn btn-primary" onclick="openEventModal()">+ Create Event</button>
            </header>

            <div class="glass-panel" style="padding: 1.5rem;">
                <div class="table-container">
                    <table id="eventsTable">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Location</th>
                                <th>Dates</th>
                                <th>Price</th>
                                <th>Seats</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Rendered rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Event Modal (Add/Edit) -->
    <div class="modal" id="eventModal">
        <div class="modal-content animate-fade-in">
            <h2 id="modalTitle">Create Event</h2>
            <form id="eventForm">
                <input type="hidden" id="eventId">
                <input type="hidden" id="eventImageUrl">
                <input type="hidden" id="eventAvailableSeats">

                <div class="input-group">
                    <label>Event Name</label>
                    <input type="text" id="eventName" required>
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <textarea id="eventDesc" rows="3" required></textarea>
                </div>
                <div class="flex gap-4">
                    <div class="input-group" style="flex:1;">
                        <label>Location</label>
                        <input type="text" id="eventLocation" required>
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>Date &amp; Time</label>
                        <input type="datetime-local" id="eventDate" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Total Seats</label>
                    <input type="number" id="eventTotalSeats" min="0" required>
                    <div class="upload-status" id="availableSeatsHint"></div>
                </div>

                <div class="input-group">
                    <label>Event Image</label>
                    <input type="file" id="eventImageFile" accept="image/*">
                    <div class="upload-status" id="uploadStatus"></div>
                    <img id="imagePreview" alt="preview">
                </div>

                <div class="input-group">
                    <label>Price Ranges</label>
                    <div id="priceRows"></div>
                    <button type="button" class="link-btn" onclick="addPriceRow()">+ Add price tier</button>
                </div>

                <div class="flex gap-4 mt-4">
                    <button type="button" class="btn" onclick="closeEventModal()" style="background: rgba(255,255,255,0.1);">Cancel</button>
                    <button type="submit" class="btn btn-primary flex-1" id="saveBtn">Save Event</button>
                </div>
            </form>
        </div>
    </div>

    <script src="env-config.js"></script>
    <script src="js/api.js"></script>
    <script>
        if (!api.isAuthenticated()) window.location.href = 'login.html';

        let events = [];

        async function loadEvents() {
            try {
                const res = await api.getEvents();
                events = res.eventList || [];
                renderEvents();
            } catch (err) {
                alert("Failed to load events: " + err.message);
            }
        }

        function seatsPill(ev) {
            const total = Number(ev.totalSeats || 0);
            const avail = (ev.availableSeats === undefined || ev.availableSeats === null)
                ? total : Number(ev.availableSeats);
            let cls = 'seats-ok';
            if (avail <= 0) cls = 'seats-full';
            else if (total > 0 && avail / total <= 0.2) cls = 'seats-low';
            return `<span class="seats-pill ${cls}">${avail}/${total}</span>`;
        }

        function priceSummary(ev) {
            if (!ev.priceRanges || ev.priceRanges.length === 0) return '<span class="text-muted">—</span>';
            const prices = ev.priceRanges.map(p => Number(p.price)).filter(n => !isNaN(n));
            if (prices.length === 0) return '<span class="text-muted">—</span>';
            const min = Math.min(...prices), max = Math.max(...prices);
            return min === max ? `Rs ${min}` : `Rs ${min} – ${max}`;
        }

        function renderEvents() {
            const tbody = document.querySelector('#eventsTable tbody');
            tbody.innerHTML = '';

            if (events.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No events found</td></tr>';
                return;
            }

            events.forEach(event => {
                let dateStr = '-';
                if (event.dates && event.dates.length > 0) {
                    dateStr = event.dates.map(d => new Date(d).toLocaleString()).join(', ');
                }
                const img = event.imageUrl
                    ? `<img class="thumb" src="${event.imageUrl}" alt="">`
                    : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;">🎫</div>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${img}</td>
                    <td><strong>${event.name || '-'}</strong></td>
                    <td>${event.location || '-'}</td>
                    <td>${dateStr}</td>
                    <td>${priceSummary(event)}</td>
                    <td>${seatsPill(event)}</td>
                    <td>
                        <button class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.8rem; background: rgba(255,255,255,0.1);" onclick="editEvent('${event.eventId}')">Edit</button>
                        <button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;" onclick="deleteEvent('${event.eventId}')">Del</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ── Price range rows ─────────────────────────────────────────────────────
        function addPriceRow(label = '', price = '') {
            const wrap = document.getElementById('priceRows');
            const row = document.createElement('div');
            row.className = 'price-row';
            row.innerHTML = `
                <input type="text" placeholder="Tier (e.g. VIP)" class="pr-label" value="${label}">
                <input type="number" placeholder="Price" class="pr-price" min="0" step="0.01" value="${price}">
                <button type="button" class="icon-btn" title="Remove">&times;</button>
            `;
            row.querySelector('.icon-btn').onclick = () => row.remove();
            wrap.appendChild(row);
        }

        function collectPriceRanges() {
            const rows = document.querySelectorAll('#priceRows .price-row');
            const ranges = [];
            rows.forEach(r => {
                const label = r.querySelector('.pr-label').value.trim();
                const priceVal = r.querySelector('.pr-price').value;
                if (label || priceVal !== '') {
                    ranges.push({ label: label || 'General', price: priceVal === '' ? 0 : Number(priceVal) });
                }
            });
            return ranges;
        }

        // ── Modal lifecycle ──────────────────────────────────────────────────────
        function openEventModal() {
            document.getElementById('modalTitle').textContent = 'Create Event';
            document.getElementById('eventForm').reset();
            document.getElementById('eventId').value = '';
            document.getElementById('eventImageUrl').value = '';
            document.getElementById('eventAvailableSeats').value = '';
            document.getElementById('priceRows').innerHTML = '';
            addPriceRow();
            resetImagePreview();
            document.getElementById('availableSeatsHint').textContent = '';
            document.getElementById('eventModal').classList.add('active');
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        function resetImagePreview() {
            const preview = document.getElementById('imagePreview');
            preview.style.display = 'none';
            preview.src = '';
            document.getElementById('uploadStatus').textContent = '';
            document.getElementById('eventImageFile').value = '';
        }

        function editEvent(eventId) {
            const event = events.find(e => e.eventId === eventId);
            if (!event) return;

            document.getElementById('modalTitle').textContent = 'Edit Event';
            document.getElementById('eventId').value = event.eventId;
            document.getElementById('eventName').value = event.name || '';
            document.getElementById('eventDesc').value = event.description || '';
            document.getElementById('eventLocation').value = event.location || '';
            document.getElementById('eventTotalSeats').value = event.totalSeats ?? 0;
            document.getElementById('eventAvailableSeats').value =
                (event.availableSeats ?? event.totalSeats ?? 0);
            document.getElementById('eventImageUrl').value = event.imageUrl || '';

            document.getElementById('availableSeatsHint').textContent =
                `Currently ${event.availableSeats ?? event.totalSeats ?? 0} seat(s) available.`;

            // Image preview
            resetImagePreview();
            if (event.imageUrl) {
                const preview = document.getElementById('imagePreview');
                preview.src = event.imageUrl;
                preview.style.display = 'block';
            }

            // Price ranges
            const wrap = document.getElementById('priceRows');
            wrap.innerHTML = '';
            if (event.priceRanges && event.priceRanges.length > 0) {
                event.priceRanges.forEach(p => addPriceRow(p.label || '', p.price ?? ''));
            } else {
                addPriceRow();
            }

            if (event.dates && event.dates.length > 0) {
                const dt = new Date(event.dates[0]);
                dt.setMinutes(dt.getMinutes() - dt.getTimezoneOffset());
                document.getElementById('eventDate').value = dt.toISOString().slice(0, 16);
            }

            document.getElementById('eventModal').classList.add('active');
        }

        // Live image preview on file selection
        document.getElementById('eventImageFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const preview = document.getElementById('imagePreview');
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
                document.getElementById('uploadStatus').textContent = 'New image selected — will upload on save.';
            }
        });

        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            const originalLabel = saveBtn.textContent;

            try {
                const id = document.getElementById('eventId').value;
                const dateVal = document.getElementById('eventDate').value;
                const totalSeats = Number(document.getElementById('eventTotalSeats').value || 0);

                // Upload a freshly selected image directly to S3 first.
                let imageUrl = document.getElementById('eventImageUrl').value || null;
                const file = document.getElementById('eventImageFile').files[0];
                if (file) {
                    saveBtn.textContent = 'Uploading image...';
                    document.getElementById('uploadStatus').textContent = 'Uploading image to storage...';
                    imageUrl = await api.uploadEventImage(file);
                    document.getElementById('uploadStatus').textContent = 'Image uploaded ✓';
                }

                saveBtn.textContent = 'Saving...';

                const eventData = {
                    name: document.getElementById('eventName').value,
                    description: document.getElementById('eventDesc').value,
                    location: document.getElementById('eventLocation').value,
                    dates: [dateVal.length === 16 ? dateVal + ':00' : dateVal],
                    priceRanges: collectPriceRanges(),
                    totalSeats: totalSeats,
                    imageUrl: imageUrl
                };

                if (id) {
                    eventData.eventId = id;
                    // Preserve the existing availability ledger; if total grew, expose the extra seats.
                    const prevTotal = Number((events.find(x => x.eventId === id) || {}).totalSeats || 0);
                    const prevAvail = Number(document.getElementById('eventAvailableSeats').value || 0);
                    eventData.availableSeats = Math.max(0, prevAvail + (totalSeats - prevTotal));
                    await api.updateEvent(eventData);
                } else {
                    eventData.availableSeats = totalSeats; // new event: all seats open
                    await api.addEvent(eventData);
                }

                closeEventModal();
                loadEvents();
            } catch (err) {
                document.getElementById('uploadStatus').textContent = '';
                alert("Error saving event: " + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = originalLabel;
            }
        });

        async function deleteEvent(eventId) {
            if (confirm("Are you sure you want to delete this event? This action cannot be undone.")) {
                try {
                    await api.deleteEvent(eventId);
                    loadEvents();
                } catch (err) {
                    alert("Failed to delete event: " + err.message);
                }
            }
        }

        loadEvents();
    </script>
</body>
</html>
