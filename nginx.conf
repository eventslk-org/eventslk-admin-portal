server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static admin portal. All API traffic goes directly to the API Gateway at
    # window.ENV.API_BASE_URL (see env-config.js); the gateway handles CORS, so no
    # /api reverse-proxy is needed here.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the runtime config so a repointed API_BASE_URL takes effect immediately.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }
}
